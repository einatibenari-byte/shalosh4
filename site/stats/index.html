<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>סטטיסטיקות המשחק</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
:root{--teal:#5CD6CF;--cream:#F6EEE1;--card:#F7F0E4;--navy:#14193A;--muted:#5E6170;--line:#E2D6C2;--for:#15A37A;--against:#EC6670;--none:#8E9AA3;--spot:#F7BE45}
*{box-sizing:border-box}
body{margin:0;background:var(--teal);color:var(--navy);font-family:Rubik,system-ui,sans-serif;font-size:16px;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--navy);opacity:.75;font-size:14px;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1.5px solid var(--navy);border-radius:14px;padding:14px 16px}
.num{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.lbl{font-size:14px;color:var(--muted)}
h2{font-size:18px;margin:0 0 10px}
.sec{margin-top:12px}
.bars{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line);direction:ltr}
.bars div{flex:1;background:var(--navy);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.bars div:hover{background:var(--spot)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);direction:ltr;margin-top:4px}
.tip{font-size:13px;color:var(--muted);min-height:20px;margin-top:4px}
.split{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:6px 0}
.split span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;font-size:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:5px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-weight:500;color:var(--muted)}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.mini{display:flex;height:8px;border-radius:4px;overflow:hidden;width:90px;margin-top:6px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.dist b{display:block;height:14px;background:var(--navy);border-radius:4px}
.err{background:var(--card);border-radius:14px;padding:20px;text-align:center}
</style>
</head>
<body>
<main>
<h1>סטטיסטיקות המשחק</h1>
<p class="sub" id="upd">טוען…</p>
<div id="app"></div>
</main>
<script src="labels.js"></script>
<script>
const KEY = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString('he-IL');
const pct = (a, t) => t ? Math.round(a * 100 / t) : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function bars(rows, fmtTip){
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<div class="bars">${rows.map(r => `<div style="height:${r[1]*100/max}%" title="${esc(fmtTip(r))}" data-tip="${esc(fmtTip(r))}"></div>`).join('')}</div>`;
}

function render(s){
  const t = s.tags || {}, tot = (t.F||0) + (t.A||0) + (t.B||0);
  // hourly, last 48 hours, gaps filled with zero (Israel time)
  const hmap = Object.fromEntries(s.hours), hrs = [];
  const now = new Date(s.now);
  for (let i = 47; i >= 0; i--){
    const d = new Date(now - i * 3600e3);
    const p = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Jerusalem', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hourCycle:'h23'}).formatToParts(d);
    const g = k => p.find(x => x.type === k).value;
    const key = `${g('year')}-${g('month')}-${g('day')}T${g('hour')}`;
    hrs.push([key, hmap[key] || 0]);
  }
  const hl = k => `${k.slice(8,10)}.${k.slice(5,7)} ${k.slice(11)}:00`;
  const order = ['1','2-4','5-9','10-24','25-49','50+'];
  const bmax = Math.max(1, ...order.map(k => s.buckets?.[k] || 0));
  const sh = s.shares || {};
  $('#app').innerHTML = `
  <div class="grid">
    <div class="card"><div class="num">${fmt(s.players)}</div><div class="lbl">שחקנים שהצביעו לפחות פעם אחת</div></div>
    <div class="card"><div class="num">${fmt(s.players_24h)}</div><div class="lbl">שחקנים חדשים ב־24 השעות האחרונות</div></div>
    <div class="card"><div class="num">${fmt(s.players_1h)}</div><div class="lbl">שחקנים חדשים בשעה האחרונה</div></div>
    <div class="card"><div class="num">${fmt(s.marks)}</div><div class="lbl">הצבעות של שחקנים, על ${fmt(s.bills)} הצעות חוק</div></div>
    <div class="card"><div class="num">${fmt(s.median)}</div><div class="lbl">הצבעות לשחקן (חציון). ממוצע ${fmt(s.avg)}, הכי הרבה ${fmt(s.max)}</div></div>
  </div>
  <div class="card sec"><h2>שחקנים חדשים לפי שעה, 48 השעות האחרונות</h2>
    ${bars(hrs, r => `${hl(r[0])}: ${r[1]} שחקנים`)}
    <div class="axis"><span>${hl(hrs[0][0])}</span><span>${hl(hrs[24][0])}</span><span>עכשיו</span></div>
    <div class="tip" id="tip">אפשר לגעת בעמודה כדי לראות את המספר</div></div>
  <div class="card sec"><h2>שחקנים חדשים לפי יום</h2>
    <table>${s.days.slice().reverse().map(d => `<tr><td>${d[0].slice(8,10)}.${d[0].slice(5,7)}</td><td class="n">${fmt(d[1])}</td></tr>`).join('')}</table></div>
  <div class="card sec"><h2>איך השחקנים הצביעו</h2>
    <div class="split">
      <span style="flex:${t.F||0};background:var(--for)">${pct(t.F,tot)}%</span>
      <span style="flex:${t.A||0};background:var(--against)">${pct(t.A,tot)}%</span>
      <span style="flex:${t.B||0};background:var(--none)">${pct(t.B,tot)}%</span></div>
    <div class="legend"><span><i style="background:var(--for)"></i>בעד ${fmt(t.F||0)}</span><span><i style="background:var(--against)"></i>נגד ${fmt(t.A||0)}</span><span><i style="background:var(--none)"></i>נמנע/ת ${fmt(t.B||0)}</span></div></div>
  <div class="card sec"><h2>כמה הצבעות כל שחקן עשה</h2>
    <div class="dist">${order.map(k => `<span>${k}</span><span><b style="width:${(s.buckets?.[k]||0)*100/bmax}%"></b></span><span>${fmt(s.buckets?.[k]||0)}</span>`).join('')}</div></div>
  <div class="card sec"><h2>ההצעות שהכי הרבה שחקנים הצביעו עליהן</h2>
    <table><tr><th>הצעה</th><th>שחקנים</th></tr>${s.top.map(r => { const [id, c, f, a, b] = r;
      return `<tr><td>${esc((typeof LABELS !== 'undefined' && LABELS[id]) || ('הצבעה ' + id))}
        <div class="mini"><span style="flex:${f};background:var(--for)"></span><span style="flex:${a};background:var(--against)"></span><span style="flex:${b};background:var(--none)"></span></div></td>
        <td class="n">${fmt(c)}<br><span class="lbl">${pct(f,c)}% בעד</span></td></tr>` }).join('')}</table></div>
  <div class="grid sec">
    <div class="card"><div class="num">${fmt(sh.summary||0)}</div><div class="lbl">שיתופים של כרטיס הסיכום</div></div>
    <div class="card"><div class="num">${fmt(sh.vote||0)}</div><div class="lbl">שיתופים של הצבעה בודדת</div></div>
    <div class="card"><div class="num">${fmt(sh.open||0)}</div><div class="lbl">כניסות מקישור ששותף</div></div>
    <div class="card"><div class="num">${fmt(s.reports)}</div><div class="lbl">דיווחי "מצאת טעות?" (${fmt(s.reports_open)} פתוחים)</div></div>
  </div>
  <p class="sub sec">נספרים רק מי שהצביעו לפחות פעם אחת. כניסות לאתר בלי הצבעה רואים ב־Cloudflare. הנתונים מ־${new Date(s.first_at).toLocaleDateString('he-IL', {timeZone:'Asia/Jerusalem'})}. שעות לפי שעון ישראל.</p>`;
  document.querySelectorAll('.bars div').forEach(el => { el.onclick = el.onmouseenter = () => $('#tip').textContent = el.dataset.tip });
  $('#upd').textContent = 'עודכן ' + new Date(s.now).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jerusalem'}) + ' · מתעדכן לבד כל דקה';
}

async function load(){
  if (!KEY){ $('#upd').textContent = ''; $('#app').innerHTML = '<div class="err">צריך את הקישור הפרטי כדי לראות את העמוד.</div>'; return }
  try {
    const r = await fetch('/api/stats', {headers:{'X-Stats-Key':KEY}, cache:'no-store'});
    if (r.status === 403){ $('#upd').textContent = ''; $('#app').innerHTML = '<div class="err">הקישור לא תקין.</div>'; return }
    render(await r.json());
  } catch(e){ $('#upd').textContent = 'לא הצלחתי לטעון עכשיו, אנסה שוב בעוד דקה' }
}
load(); setInterval(load, 60e3);
</script>
</body>
</html>
